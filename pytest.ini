[pytest]
DJANGO_SETTINGS_MODULE = djilab.settings
python_files = tests.py test_*.py *_tests.py
addopts =
    --verbose
    --cov=catalog
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --disable-warnings
markers =
    unit: Unit tests - fast, isolated
    integration: Integration tests - DB interaction
    smoke: Smoke tests - critical path only
    regression: Regression tests - full suite
    auth: Authentication related tests
    services: Services entity tests
    orders: Orders entity tests
